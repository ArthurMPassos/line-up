<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16122a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lineup</title>
<style>
:root {
  --bg: #16122a;
  --bg2: #221a3f;
  --surface: #261f45;
  --surface2: #312857;
  --line: #3e3468;
  --text: #f5f1ff;
  --muted: #a49cc8;
  --accent: #ffb547;
  --accent-ink: #2a1a00;
  --good: #4ade80;
  --bad: #ff5d6c;
  --radius: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% -10%, var(--bg2), var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
#app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, p { margin: 0; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.eyebrow { color: var(--accent); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
.spacer { flex: 1; }

/* Buttons */
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary, .ghost {
  min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s;
}
.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px -8px var(--accent); }
.ghost { border: 1.5px solid var(--line); background: var(--surface); }
.primary:active:not(:disabled), .ghost:active:not(:disabled) { transform: scale(.97); }
.big { width: 100%; min-height: 58px; font-size: 18px; }
.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.link { color: var(--muted); text-decoration: underline; padding: 8px; align-self: center; }
.icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; color: var(--muted); }
.icon:active { background: var(--surface2); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Setup */
.setup-top { display: flex; justify-content: flex-end; }
.brand { text-align: center; padding: 8px 0 4px; }
.brand h1 { font-size: 44px; letter-spacing: -.02em; font-weight: 900; }
.brand h1 span { color: var(--accent); }
.fan { display: flex; justify-content: center; height: 86px; margin-bottom: 10px; }
.fan .card { margin: 0 -10px; }
.fan .card:nth-child(1) { transform: rotate(-14deg) translateY(10px); }
.fan .card:nth-child(3) { transform: rotate(14deg) translateY(10px); }
.prow { display: flex; gap: 8px; align-items: center; }
.prow .num { width: 22px; color: var(--muted); font-size: 14px; text-align: right; }
.pname, .field {
  flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--text); font: inherit; padding: 0 14px; -webkit-user-select: text; user-select: text;
}
.field { width: 100%; height: 48px; }
.pname:focus, .field:focus { outline: none; border-color: var(--accent); }

/* Language switch */
.lang { display: flex; align-self: center; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.lang button { min-height: 34px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--muted); }
.lang button.on { background: var(--accent); color: var(--accent-ink); }

/* Topbar */
.topbar { display: flex; justify-content: flex-end; margin-bottom: -8px; }

/* Theme */
.theme-card {
  background: linear-gradient(160deg, var(--surface2), var(--surface));
  border: 1px solid var(--line); border-radius: 24px; padding: 28px 20px 22px;
  display: flex; flex-direction: column; gap: 24px; text-align: center;
  box-shadow: 0 20px 40px -20px #000a;
}
.theme-t { font-size: 27px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.scale .bar { height: 10px; border-radius: 99px; background: linear-gradient(90deg, hsl(210 80% 58%), hsl(150 65% 50%), hsl(55 90% 55%), hsl(0 80% 58%)); }
.scale .ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; text-align: left; }
.scale .ends > div { max-width: 48%; display: flex; flex-direction: column; }
.scale .ends .r { text-align: right; }
.scale b { font-size: 20px; font-weight: 900; }
.scale span { color: var(--muted); font-size: 14px; line-height: 1.25; }
.theme-mini { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
.theme-mini .t { font-weight: 800; font-size: 18px; line-height: 1.25; }
.theme-mini .scale b { font-size: 15px; }
.theme-mini .scale span { font-size: 13px; }
.theme-mini .scale .bar { height: 6px; }

/* Cards */
.card {
  --h: 30;
  width: 62px; height: 86px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center; position: relative;
  line-height: 1; text-align: center; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  padding: 0; overflow: hidden;
  background: linear-gradient(160deg, hsl(var(--h) 85% 62%), hsl(var(--h) 75% 42%));
  box-shadow: 0 8px 18px -8px #000c, inset 0 0 0 2px #ffffff30;
  color: #fff; font-weight: 900; font-size: 28px; text-shadow: 0 2px 6px #0005;
}
.card::after { content: ""; position: absolute; inset: 5px; border-radius: 8px; border: 1.5px solid #ffffff45; }
.card.back { background: repeating-linear-gradient(45deg, #3b2f6e 0 8px, #45387e 8px 16px); }
.card.back::before { content: "?"; color: #ffffff60; font-size: 28px; }
.card.big { width: 130px; height: 180px; border-radius: 20px; font-size: 64px; }
.card.big::after { inset: 9px; border-radius: 13px; }
.card.big.back::before { font-size: 54px; }
.card.sm { width: 44px; height: 60px; border-radius: 9px; font-size: 20px; }
.card.sm::after { inset: 4px; border-radius: 6px; }
.card.bad { box-shadow: 0 0 0 3px var(--bad), 0 8px 18px -8px #000c; }

/* Deal */
.handoff { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 12px 0; }
.who { font-size: 42px; font-weight: 900; word-break: break-word; }
.hand { display: flex; justify-content: center; margin: 8px 0; }
.hand .card:not(.back) { animation: flipIn .5s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes flipIn { from { transform: rotateY(90deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }

/* Table / play */
.table { background: #0d0a1e80; border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; min-height: 98px; }
.pile { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.pile::-webkit-scrollbar { display: none; }
.pile.wrap { flex-wrap: wrap; overflow: visible; justify-content: center; }
.pc { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 50px; flex: none; }
.pc small { font-size: 11px; color: var(--muted); max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc.new .card { animation: flipIn .5s both; }
.players { display: flex; flex-direction: column; gap: 8px; }
.pl { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 14px; min-height: 62px; }
.pl-name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl.done { opacity: .45; }

/* Theme list */
[hidden] { display: none !important; }
.tl-head { display: flex; align-items: center; gap: 12px; }
.tlist { display: flex; flex-direction: column; gap: 6px; }
.trow {
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 3px;
}
.trow b { font-weight: 700; line-height: 1.3; }
.trow span { color: var(--muted); font-size: 13px; }
.trow.on { border-color: var(--accent); }
.trow:active { background: var(--surface2); }

/* Lineup: drag face-down cards into order, then flip top to bottom */
.hint { color: var(--muted); font-size: 14px; text-align: center; }
.end-label { display: flex; gap: 8px; align-items: baseline; color: var(--muted); font-size: 13px; padding: 0 6px; }
.end-label b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
.lineup { display: flex; flex-direction: column; gap: 6px; }
.arow {
  display: flex; align-items: center; gap: 12px; position: relative;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 7px 10px 7px 12px;
}
.arow .pos { width: 18px; text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.arow .nm { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .card.sm { width: 38px; height: 52px; font-size: 18px; }
.arow .grip { color: var(--muted); font-size: 22px; line-height: 1; padding: 0 2px; }
.arranging .arow { touch-action: none; cursor: grab; }
.arow.lifted { z-index: 5; background: var(--surface2); border-color: var(--accent); box-shadow: 0 14px 30px -10px #000c; cursor: grabbing; }
.arow.next { border-color: var(--accent); cursor: pointer; }
.arow .mark { width: 24px; text-align: center; font-weight: 900; font-size: 18px; }
.mark.ok { color: var(--good); }
.mark.no { color: var(--bad); }
.arow.fresh .card { animation: flipIn .5s both; }
/* 3-digit numbers (100) get a smaller size so they stay inside the inner frame */
.card.n3 { font-size: 23px; }
.card.big.n3 { font-size: 50px; }
.card.sm.n3 { font-size: 16px; }
.arow .card.sm.n3 { font-size: 14px; }
.arow.fresh .mark { animation: fade .3s .4s both; }

/* Results */
.result { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 16px 0 4px; }
.result .emoji { font-size: 64px; line-height: 1; animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both; }
.result h1 { font-size: 34px; font-weight: 900; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.section-label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; text-align: center; margin: 4px 0 8px; }

/* Modal */
#modal:empty { display: none; }
.backdrop {
  position: fixed; inset: 0; background: #07051099; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center; z-index: 10; animation: fade .2s both;
}
.sheet {
  width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 26px 26px 0 0; padding: 22px 18px max(20px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 14px; animation: up .28s cubic-bezier(.2,.9,.3,1) both;
}
.sheet.center { text-align: center; }
.sheet h3 { margin: 0; font-size: 22px; }
.sheet .stack { display: flex; flex-direction: column; gap: 10px; }
.sheet ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; color: #ddd6f5; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }

.flip { display: flex; justify-content: center; perspective: 800px; margin: 6px 0; }
.flip .card { animation: bigFlip .8s cubic-bezier(.2,.8,.3,1.1) both; }
@keyframes bigFlip {
  0% { transform: rotateY(180deg) scale(.7); filter: brightness(0); }
  50% { filter: brightness(0); }
  51% { filter: none; }
  100% { transform: none; }
}
.verdict { font-size: 22px; font-weight: 900; animation: fade .3s .85s both; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.later { animation: fade .3s .9s both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; }
}
</style>
</head>

const KEY = 'lineup-save-v4';
const MAX_PLAYERS = 20;

const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // accent-insensitive search
const defaultLang = () => (/^pt/i.test(navigator.language || '') ? 'pt' : 'en');

function fresh() {
  return {
    v: 4, lang: defaultLang(), screen: 'setup',
    players: ['', '', ''],
    theme: null, usedThemes: [],
    nums: [], dealIdx: 0, dealShown: false,
    order: [],        // player indices, top (lowest guess) to bottom
    phase: 'arrange', // 'arrange' | 'flip' | 'done'
    flips: 0,         // how many cards from the top are face up
  };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 4) { s.dealShown = false; return s; } } catch (e) {}
  return null;
}
let S = load() || fresh();
let freshFlip = false; // animates the card that was just flipped

// ---------- Game logic ----------
// S.theme is either { i: index into THEMES } or { custom: { t, lo, hi } }
function theme() {
  if (!S.theme) return { t: '', lo: '', hi: '' };
  if (S.theme.custom) return S.theme.custom;
  const r = THEMES[S.theme.i], o = S.lang === 'pt' ? 3 : 0;
  return { t: r[o], lo: r[o + 1], hi: r[o + 2] };
}
function pickTheme() {
  let pool = THEMES.map((_, i) => i).filter(i => !S.usedThemes.includes(i));
  if (!pool.length) { S.usedThemes = []; pool = THEMES.map((_, i) => i); }
  const i = pool[Math.floor(Math.random() * pool.length)];
  S.usedThemes.push(i);
  S.theme = { i };
}
function newRound() {
  pickTheme();
  S.nums = shuffle(Array.from({ length: 100 }, (_, i) => i + 1)).slice(0, S.players.length);
  S.order = S.players.map((_, i) => i);
  S.phase = 'arrange'; S.flips = 0;
  S.dealIdx = 0; S.dealShown = false;
  S.screen = 'theme';
}
// The card at position k is out of order when a card above it is higher.
const badAt = k => S.order.slice(0, k).some(p => S.nums[p] > S.nums[S.order[k]]);

// ---------- Rendering helpers ----------
const hue = v => Math.round(210 - (v - 1) * (210 / 99));
const card = (v, size = '', extra = '') => `<div class="card ${size} ${extra} ${v >= 100 ? 'n3' : ''}" style="--h:${hue(v)}">${v}</div>`;
const back = (size = '') => `<div class="card back ${size}"></div>`;
const topbar = () => `<div class="topbar"><button class="icon" data-act="menu" aria-label="${T.menu}">☰</button></div>`;
const scale = th => `<div class="scale"><div class="bar"></div><div class="ends">
  <div><b>1</b><span>${esc(th.lo)}</span></div>
  <div class="r"><b>100</b><span>${esc(th.hi)}</span></div></div></div>`;
const themeMini = () => { const th = theme(); return `<div class="theme-mini"><div class="t">${esc(th.t)}</div>${scale(th)}</div>`; };
const langSwitch = () => `<div class="lang" role="group" aria-label="${T.language}">
  <button class="${S.lang === 'en' ? 'on' : ''}" data-act="setLang" data-arg="en">English</button>
  <button class="${S.lang === 'pt' ? 'on' : ''}" data-act="setLang" data-arg="pt">Português</button></div>`;

      ${themeMini()}
    </div>
    <button class="primary big" data-act="hideDeal">${T.gotIt}</button>`;
  },

  play() {
    const th = theme(), arranging = S.phase === 'arrange', done = S.phase === 'done';
    const bad = done ? S.order.filter((_, k) => badAt(k)).length : 0;
    const rows = S.order.map((p, k) => {
      const up = k < S.flips, isNext = S.phase === 'flip' && k === S.flips;
      const fresh = freshFlip && k === S.flips - 1;
      return `<div class="arow ${fresh ? 'fresh' : ''} ${isNext ? 'next' : ''}" data-p="${p}" ${isNext ? 'data-act="flipNext"' : ''}>
        <span class="pos">${k + 1}</span>
        ${up ? card(S.nums[p], 'sm') : back('sm')}
        <span class="nm">${esc(S.players[p])}</span>
        ${arranging
          ? `<button class="ghost sm" data-act="peek" data-arg="${p}">${T.peek}</button><span class="grip" aria-hidden="true">≡</span>`
          : up ? `<span class="mark ${badAt(k) ? 'no' : 'ok'}">${badAt(k) ? '✗' : '✓'}</span>` : ''}
      </div>`;
    }).join('');
    return `${topbar()}
    ${done
      ? `<div class="result"><div class="emoji">${bad ? '🤔' : '🎉'}</div><h1>${bad ? T.notQuite(bad) : T.perfect}</h1>
         <p class="muted">${esc(th.t)}</p></div>`
      : themeMini()}
    ${arranging ? `<p class="hint">${T.dragHint}</p>` : ''}
    <div class="end-label"><b>1</b>${esc(th.lo)}</div>
    <div class="lineup ${arranging ? 'arranging' : ''}" id="lineup">${rows}</div>
    <div class="end-label"><b>100</b>${esc(th.hi)}</div>
    <div class="spacer"></div>
    ${arranging ? `<button class="primary big" data-act="startFlip">${T.startFlip}</button>`
      : done ? `<button class="primary big" data-act="again">${T.playAgain}</button>
                <button class="ghost" data-act="toSetup">${T.editPlayers}</button>`
      : `<button class="primary big" data-act="flipNext">${T.flipNext}</button>`}`;
  },
};

function render() {
  document.documentElement.lang = S.lang === 'pt' ? 'pt-BR' : 'en';
  $app.innerHTML = screens[S.screen]();
  save();
}

// ---------- Modals ----------
function openModal(html, cls = '') {
  $modal.innerHTML = `<div class="backdrop" data-act="backdrop"><div class="sheet ${cls}">${html}</div></div>`;
}
function closeModal() { $modal.innerHTML = ''; }

// ---------- Actions ----------
const actions = {
  backdrop(_, el, e) { if (e.target === el && !$modal.querySelector('[data-locked]')) closeModal(); },
  close: closeModal,
  rules() { openModal(`${T.rules}<button class="primary big" data-act="close">${T.gotItBtn}</button>`); },
  setLang(l) {
    S.lang = l === 'pt' ? 'pt' : 'en';
    render();
    if ($modal.innerHTML) actions.menu(); // refresh the open menu in the new language
  },

  addPlayer() {
    if (S.players.length >= MAX_PLAYERS) return;
    S.players.push(''); render();
    const inputs = $app.querySelectorAll('.pname');
    inputs[inputs.length - 1]?.focus();
  },
  rmPlayer(i) { if (S.players.length > 2) { S.players.splice(+i, 1); render(); } },
  start() {
    S.players = S.players.map((n, i) => n.trim() || T.playerN(i + 1));
    newRound(); render();
  },

  reroll() { pickTheme(); render(); },
  listThemes() { S.screen = 'themes'; render(); window.scrollTo(0, 0); },
  backToTheme() { S.screen = 'theme'; render(); window.scrollTo(0, 0); },
  chooseTheme(i) {
    S.theme = { i: +i };
    if (!S.usedThemes.includes(+i)) S.usedThemes.push(+i);
    actions.backToTheme();
  },
  customTheme() {
    openModal(`<h3>${T.customTitle}</h3>
      <label class="f">${T.themeLbl}<input class="field" id="ct" maxlength="80" placeholder="${T.themePh}"></label>
      <label class="f">${T.oneMeans}<input class="field" id="clo" maxlength="30" placeholder="${T.loPh}"></label>
      <label class="f">${T.hundredMeans}<input class="field" id="chi" maxlength="30" placeholder="${T.hiPh}"></label>
      <div class="row"><button class="ghost" data-act="close">${T.cancel}</button><button class="primary" data-act="saveTheme">${T.useIt}</button></div>`);
    setTimeout(() => document.getElementById('ct')?.focus(), 50);
  },
  saveTheme() {
    const t = document.getElementById('ct').value.trim();
    if (!t) { document.getElementById('ct').focus(); return; }
    S.theme = { custom: {
      t,
      lo: document.getElementById('clo').value.trim() || T.lowest,
      hi: document.getElementById('chi').value.trim() || T.highest,
    } };
    closeModal(); render();
  },
  startDeal() { S.screen = 'deal'; S.dealIdx = 0; S.dealShown = false; render(); },
  revealDeal() { S.dealShown = true; render(); },
  hideDeal() {
    S.dealShown = false; S.dealIdx++;
    if (S.dealIdx >= S.players.length) S.screen = 'play';
    render();
  },

  peek(i) {
    const name = esc(S.players[i]);
    openModal(`<h3>${T.peekTitle(name)}</h3>
      <div class="row"><button class="ghost" data-act="close">${T.cancel}</button><button class="primary" data-act="peekShow" data-arg="${i}">${T.show}</button></div>`, 'center');
  },
  peekShow(i) {
    openModal(`<p class="eyebrow">${esc(S.players[i])}</p>
      <div class="hand">${card(S.nums[i], 'big')}</div>
      <button class="primary big" data-act="close">${T.hide}</button>`, 'center');
  },

  startFlip() { S.phase = 'flip'; S.flips = 0; render(); },
  flipNext() {
    if (S.phase !== 'flip') return;
    S.flips++;
    if (badAt(S.flips - 1)) { try { navigator.vibrate?.(150); } catch (e) {} }
    if (S.flips >= S.order.length) S.phase = 'done';
    freshFlip = true; render(); freshFlip = false;
  },

  again() { newRound(); render(); },
  toSetup() { closeModal(); S.screen = 'setup'; render(); },

  menu() {
    if (S.screen === 'setup') { closeModal(); return; }
    openModal(`<h3>${T.menu}</h3><div class="stack">
      ${langSwitch()}
      <button class="ghost big" data-act="rules">${T.howTo}</button>
      <button class="ghost big" data-act="newRoundGo">${T.newRound}</button>
      <button class="ghost big" data-act="toSetup">${T.editPlayers}</button>
      <button class="primary big" data-act="close">${T.close}</button></div>`);
  },
  newRoundGo() { closeModal(); newRound(); render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
  if (S.screen !== 'setup') keepAwake();
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('pname')) { S.players[+e.target.dataset.i] = e.target.value; save(); }
  if (e.target.id === 'tsearch') {
    const q = norm(e.target.value.trim());
    $app.querySelectorAll('.trow').forEach(r => { r.hidden = !!q && !r.dataset.q.includes(q); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('pname')) return;
  const inputs = [...$app.querySelectorAll('.pname')];
  const next = inputs[inputs.indexOf(e.target) + 1];
  if (next) next.focus(); else e.target.blur();
});

// ---------- Drag to reorder (arrange phase) ----------
// The dragged row follows the finger; neighbours swap past it at their midpoints.
let drag = null;
const mid = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; };
function renumber(list) { [...list.children].forEach((r, k) => { r.querySelector('.pos').textContent = k + 1; }); }
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('.arranging .arow');
  if (!row || e.target.closest('button') || drag) return;
  e.preventDefault();
  drag = { row, list: row.parentNode, id: e.pointerId, grabY: e.clientY - mid(row) };
  row.classList.add('lifted');
  try { row.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const { row, list } = drag;
  const y = e.clientY - drag.grabY; // where the row's centre should be
  let n;
  while ((n = row.nextElementSibling) && y > mid(n)) list.insertBefore(n, row);
  while ((n = row.previousElementSibling) && y < mid(n)) list.insertBefore(n, row.nextElementSibling);
  row.style.transform = '';
  row.style.transform = `translateY(${y - mid(row)}px)`;
  renumber(list);
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { row, list } = drag;
  drag = null;
  row.classList.remove('lifted');
  row.style.transform = '';
  S.order = [...list.children].map(r => +r.dataset.p);
  save();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// Keep the screen on during a game
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.screen !== 'setup') keepAwake();
});

render();
</script>
</body>
</html>
